name: VibeBuddyApp
options:
  bundleIdPrefix: com.vibebuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VibeBuddyKit:
    path: ../VibeBuddyKit
targets:
  VibeBuddyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - package: VibeBuddyKit
        product: VibeBuddyKit
      - target: VibeBuddyWidget
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Scan the pairing QR shown by the vibebuddy Mac app."
        NSLocalNetworkUsageDescription: "Connect to the vibebuddy Mac app on your local network to show live session status and approve actions."
        NSMicrophoneUsageDescription: "Talk to your agents by voice. With the optional voice companion, your speech is streamed to the AI provider you choose (OpenAI, Google, or Alibaba) using your own API key — it never passes through a vibebuddy server."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: LQAVR62TK2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VibeBuddyApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release/Archive (App Store, TestFlight) uses production APNs; local
        # Debug runs on device use the sandbox (development) environment.
        Debug:
          CODE_SIGN_ENTITLEMENTS: VibeBuddyApp-Debug.entitlements
  VibeBuddyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.app.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: LQAVR62TK2
        CODE_SIGN_STYLE: Automatic
