name: VibeBuddyApp
options:
  bundleIdPrefix: com.vibebuddy
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  VibeBuddyKit:
    path: ../VibeBuddyKit
targets:
  VibeBuddyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - package: VibeBuddyKit
        product: VibeBuddyKit
      - target: VibeBuddyWidget
      - target: VibeBuddyWatch
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Scan the pairing QR shown by the vibebuddy Mac app."
        NSLocalNetworkUsageDescription: "Connect to the vibebuddy Mac app on your local network to show live session status and approve actions."
        NSMicrophoneUsageDescription: "Talk to your agents by voice. With the optional voice companion, your microphone audio and selected session context are sent directly to the AI provider you choose (OpenAI, Google, or Alibaba) using your own API key — they never pass through a vibebuddy server."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.vibebuddy.app.deeplink
            CFBundleURLSchemes:
              - vibebuddy
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.app
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: LQAVR62TK2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VibeBuddyApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release/Archive (App Store, TestFlight) uses production APNs; local
        # Debug runs on device use the sandbox (development) environment.
        Debug:
          CODE_SIGN_ENTITLEMENTS: VibeBuddyApp-Debug.entitlements
  VibeBuddyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: VibeBuddyKit
        product: VibeBuddyKit
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.app.widget
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: LQAVR62TK2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widget/VibeBuddyWidget.entitlements
  VibeBuddyWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: VibeBuddyKit
        product: VibeBuddyKit
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.vibebuddy.app
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.app.watchkitapp
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        DEVELOPMENT_TEAM: LQAVR62TK2
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VibeBuddyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VibeBuddyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
