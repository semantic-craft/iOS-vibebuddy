name: VibeBuddyMacApp
options:
  bundleIdPrefix: com.vibebuddy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  VibeBuddyKit:
    path: ../VibeBuddyKit
  VibeBuddyMac:
    path: ../VibeBuddyMac
targets:
  VibeBuddyMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: VibeBuddyMac
        product: VibeBuddyMacCore
      - package: VibeBuddyKit
        product: VibeBuddyKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.mac
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
