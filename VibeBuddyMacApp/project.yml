name: VibeBuddyMacApp
options:
  bundleIdPrefix: com.vibebuddy
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  VibeBuddyKit:
    path: ../VibeBuddyKit
  VibeBuddyMac:
    path: ../VibeBuddyMac
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  VibeBuddyMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      # Bundle the tested Python hook installers so the in-app setup (issue 06) can
      # shell out to them. Folder reference → copied to Contents/Resources/hooks/.
      - path: ../hooks
        name: hooks
        type: folder
        buildPhase: resources
    dependencies:
      - package: VibeBuddyMac
        product: VibeBuddyMacCore
      - package: VibeBuddyKit
        product: VibeBuddyKit
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        # Without these two, xcodegen writes its own defaults (1.0 / 1) into the
        # generated Info.plist and MARKETING_VERSION / CURRENT_PROJECT_VERSION below
        # never reach the bundle — which is how 0.1 shipped as "1.0 (1)".
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Talk to your buddy to ask about your agents and approve actions by voice."
        NSSpeechRecognitionUsageDescription: "Recognize your speech on-device so your buddy understands what you say."
        # Jump-to-terminal scripts Terminal.app / iTerm2 / Ghostty to raise the
        # session's own tab. macOS asks for Automation permission per target app on
        # the first attempt and refuses without this string.
        NSAppleEventsUsageDescription: "Bring the terminal window running your agent session back to the front when you jump to it."
        # Sparkle auto-update (issue 07, direct distribution only).
        # Feed: appcast.xml on the repo's gh-pages branch; DMGs are GitHub Release assets.
        # Both are produced by tools/release-mac.sh; see docs/sparkle-setup.md.
        SUFeedURL: "https://semantic-craft.github.io/iOS-vibebuddy/appcast.xml"
        # EdDSA public key; private key lives in the login Keychain under
        # service "https://sparkle-project.org", account "ed25519". Generated 2026-06-06.
        SUPublicEDKey: "3Ze0A+sHbvkQ8CLlDUIcYvm7BJS4IJLU1rNEX66F9R4="
        # SUEnableAutomaticChecks intentionally absent: Sparkle asks the user once on
        # launch whether to check automatically. There is no in-app toggle, so forcing
        # either value would take the choice away from the user.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.mac
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "6.0"
        # Build signs ad-hoc; tools/redeploy-mac.sh re-signs the built .app with a
        # stable local Apple Development identity so Keychain ACLs / TCC grants
        # survive rebuilds (no per-build keychain prompt). Kept portable here.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
