name: VibeBuddyMacApp
options:
  bundleIdPrefix: com.vibebuddy
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  VibeBuddyKit:
    path: ../VibeBuddyKit
  VibeBuddyMac:
    path: ../VibeBuddyMac
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  VibeBuddyMacApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      # Bundle the tested Python hook installers so the in-app setup (issue 06) can
      # shell out to them. Folder reference → copied to Contents/Resources/hooks/.
      - path: ../hooks
        name: hooks
        type: folder
        buildPhase: resources
    dependencies:
      - package: VibeBuddyMac
        product: VibeBuddyMacCore
      - package: VibeBuddyKit
        product: VibeBuddyKit
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: vibebuddy
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Talk to your buddy to ask about your agents and approve actions by voice."
        NSSpeechRecognitionUsageDescription: "Recognize your speech on-device so your buddy understands what you say."
        # Sparkle auto-update (issue 07, direct-distribution only). Inert until a real
        # signed appcast + EdDSA public key are filled in (see .scratch/.../07 + handoff).
        SUFeedURL: "https://vibebuddy.invalid/appcast.xml"   # TODO: host a signed appcast
        SUPublicEDKey: "3Ze0A+sHbvkQ8CLlDUIcYvm7BJS4IJLU1rNEX66F9R4="  # public key (private key in login Keychain); generated 2026-06-06
        SUEnableAutomaticChecks: false                        # opt-in only until configured
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibebuddy.mac
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Build signs ad-hoc; tools/redeploy-mac.sh re-signs the built .app with a
        # stable local Apple Development identity so Keychain ACLs / TCC grants
        # survive rebuilds (no per-build keychain prompt). Kept portable here.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
